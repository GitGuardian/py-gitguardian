name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test-lint:
    uses: ./.github/workflows/test-lint.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: [test-lint]

    # Building runs third-party code (build backend and dependencies), so this
    # job must not have access to the publishing credentials
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade build
      - name: Build distribution
        run: python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build]

    # Must match the environment configured in the PyPI trusted publisher
    environment:
      name: release
      url: https://pypi.org/p/pygitguardian

    permissions:
      # This is required for PyPI trusted publishing
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: [publish]

    permissions:
      # This is required for `gh release create` to work
      contents: write

    steps:
      - name: Read info
        id: tags
        shell: bash
        run: |
          echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job to infer the repository from
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create --draft ${{ steps.tags.outputs.tag }}
