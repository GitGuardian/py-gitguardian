name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test-lint:
    uses: ./.github/workflows/test-lint.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [test-lint]

    # Must match the environment configured in the PyPI trusted publisher
    environment:
      name: release
      url: https://pypi.org/p/pygitguardian

    permissions:
      # This is required for `gh release create` to work
      contents: write
      # This is required for PyPI trusted publishing
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read info
        id: tags
        shell: bash
        run: |
          echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade build
      - name: Build distribution
        run: python -m build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --draft ${{ steps.tags.outputs.tag }}
